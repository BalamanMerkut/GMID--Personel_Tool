name: Derleme

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrol:
    name: Kod kontrolü
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Arayüz tip kontrolü
        run: npm run check
      - name: Arayüz derlemesi
        run: npm run build

      - name: Tauri için Linux kütüphaneleri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Biçim
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Testler
        working-directory: src-tauri
        run: cargo test --locked

  windows:
    name: Windows kurulum dosyası
    runs-on: windows-latest
    # Uygulama içi güncelleme için her derleme bir GitHub sürümü olarak yayınlanır.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Clippy (Windows'a özel kod)
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings
      - name: Kurulum dosyasını derle
        run: npm run tauri build -- --bundles nsis
        env:
          # Uygulama kendi derleme numarasını bilir; daha yenisi yayınlanınca güncellemeyi önerir.
          GMID_BUILD: ${{ github.run_number }}

      - name: Sürüm dosyalarını hazırla
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path yayin | Out-Null
          Copy-Item $exe.FullName yayin/GMID-Tool-Kurulum.exe
          $h = (Get-FileHash yayin/GMID-Tool-Kurulum.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path yayin/GMID-Tool-Kurulum.exe.sha256 -Value "$h  GMID-Tool-Kurulum.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: GMID-Tool-Kurulum
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: GitHub sürümü olarak yayınla
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GMID Tool · derleme ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            yayin/GMID-Tool-Kurulum.exe
            yayin/GMID-Tool-Kurulum.exe.sha256
